name: Generate Schemas
run-name: Generate ${{ contains(inputs.version, 'dev') && 'dev' || inputs.version }} Schemas

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ESPHome version"
        required: true
        type: string

  pull_request:

jobs:
  information:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

  generate-schemas:
    runs-on: ubuntu-24.04
    needs: information
    steps:
      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.12

      - name: Checkout esphome repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: esphome/esphome
          path: esphome
          ref: ${{ contains(needs.information.outputs.version, 'dev') && 'dev' || needs.information.outputs.version }}
          fetch-depth: 1

      - name: Install ESPHome dependencies
        working-directory: esphome
        run: |
          pip install -r requirements.txt -r requirements_test.txt
          pip install -e .

      - name: Generate language schema
        run: python esphome/script/build_language_schema.py --output-path=./schema

      - name: Checkout esphome.io repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: esphome/esphome.io
          path: esphome.io
          # The docs tag is pushed separately from the esphome release and can
          # lag it; the release branch gets the version bump before this
          # workflow runs, so check out the branch instead of the tag.
          ref: ${{ contains(needs.information.outputs.version, 'dev') && 'next' || (contains(needs.information.outputs.version, 'b') && 'beta' || 'current') }}
          fetch-depth: 1

      - name: Add docs to language schema
        working-directory: esphome.io
        run: |
          if [[ "${{ contains(needs.information.outputs.version, 'b') }}" == "true" ]]; then
            DEPLOY_URL="https://beta.esphome.io"
          elif [[ "${{ contains(needs.information.outputs.version, 'dev') }}" == "true" ]]; then
            DEPLOY_URL="https://next.esphome.io"
          else
            DEPLOY_URL="https://esphome.io"
          fi

          python script/schema_doc.py ../schema --deploy-url "$DEPLOY_URL" --debug-level 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: schema
          path: schema

  upload-schemas:
    runs-on: ubuntu-24.04
    needs: generate-schemas
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: schema
          path: schema

      - name: Zip schema
        run: |
          zip -r schema.zip schema
          mv schema.zip schema/schema.zip

      - name: Upload to gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        if: ${{ !contains(inputs.version, 'dev') }}
        with:
          tag_name: ${{ inputs.version }}
          files: schema/schema.zip
          prerelease: ${{ contains(inputs.version, 'b') }}
          body: |
            This is the schema for ESPHome version ${{ inputs.version }}.
            It includes the language schema and the documentation schema.

      - name: Upload files to R2
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c  # v1.4
        with:
          r2-account-id: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_SCHEMA_BUCKET_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_SCHEMA_BUCKET_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.CLOUDFLARE_R2_SCHEMA_BUCKET }}
          source-dir: schema
          destination-dir: ${{ contains(inputs.version, 'dev') && 'dev' || inputs.version }}/
